name: Post Discord GitHub digest

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: discord-daily-digest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm test
      - name: Post digest
        env:
          DISCORD_FEED_WEBHOOK_URL: ${{ secrets.DISCORD_FEED_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: mixelpixx/Konnect
        run: npm run digest
